<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ instance_name }}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 1rem; color: #1a1a1a; }
    nav { display: flex; gap: 1rem; border-bottom: 1px solid #ddd; padding-bottom: .5rem; margin-bottom: 1rem; }
    nav form { margin: 0 0 0 auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #eee; vertical-align: top; }
    .muted { color: #666; font-size: .9em; }
    .tag { font-size: .8em; padding: 0 .4em; border: 1px solid #999; border-radius: .4em; }
    label { display: block; margin: .5rem 0 .2rem; }
    input, textarea, select { font: inherit; width: 100%; max-width: 30rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'agenda' %}">Hoy</a>
    <a href="{% url 'clients' %}">Clientes</a>
    {% if request.user.is_staff %}<a href="/ops/">Ops</a>{% endif %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Salir</button></form>
  </nav>
  {% if messages %}
    <ul>
      {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
